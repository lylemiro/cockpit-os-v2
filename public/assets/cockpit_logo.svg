<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <defs>
    <!-- Silver Metallic Mirror Gradients -->
    <linearGradient id="facetTopLeft" x1="0.2" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e5e7eb" />
      <stop offset="60%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="40%" stop-color="#6b7280" />
      <stop offset="85%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <linearGradient id="facetRightWing" x1="0.1" y1="0.0" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f3f4f6" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="90%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="facetRightFold" x1="0.0" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="rimGleam" x1="0.0" y1="0.0" x2="1.0" y2="0.0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="cyberDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g filter="url(#cyberDropShadow)">
    <!-- LEFT LOWER SHADOW BODY -->
    <path d="M 46 92 L 140 18 L 140 108 L 46 172 Z" fill="url(#facetBottomLeft)" />

    <!-- LEFT UPPER SHEEN SLICE -->
    <path d="M 46 92 L 140 18 L 140 76 L 68 122 Z" fill="url(#facetTopLeft)" />

    <!-- SPECULAR TOP RIM LIGHT -->
    <path d="M 46 92 L 140 18 L 132 20 L 52 92 Z" fill="url(#rimGleam)" />

    <!-- RIGHT WING UPPER FOLD -->
    <path d="M 140 18 L 234 84 L 198 108 L 140 68 Z" fill="url(#facetRightWing)" />

    <!-- RIGHT WING LOWER NOTCH (DOG-EAR CHEVRON) -->
    <path d="M 140 68 L 198 108 L 226 128 L 140 108 Z" fill="url(#facetRightFold)" />

    <!-- CRISP CENTER CREASE SPECULAR ACCENT -->
    <line x1="140" y1="18" x2="140" y2="108" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="140" y1="18" x2="234" y2="84" stroke="#ffffff" stroke-width="1.5" opacity="0.65" />
    <line x1="46" y1="92" x2="140" y2="18" stroke="#ffffff" stroke-width="2" opacity="0.9" />
  </g>
</svg>
